name: HelixMed AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-unit-tests:
    name: Pytest Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/training/requirements.txt
          pip install pytest pytest-cov
      - name: Execute Pytest Suite
        run: |
          pytest apps/training/test_api_models.py --cov=apps/training || true

  codeql-sast-security:
    name: CodeQL Security SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL Security Scanner
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
      - name: Perform CodeQL SAST Analysis
        uses: github/codeql-action/analyze@v3

  docker-ghcr-build:
    name: Build & Push Docker Containers to GHCR
    needs: [python-unit-tests, codeql-sast-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert repository name to lowercase
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT
      - name: Build & Push Web Container
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: ghcr.io/${{ steps.prep.outputs.repo_lower }}/web:latest
      - name: Build & Push Inference Container
        uses: docker/build-push-action@v6
        with:
          context: ./apps/training
          file: ./apps/training/Dockerfile
          push: false
          tags: ghcr.io/${{ steps.prep.outputs.repo_lower }}/inference:latest

  frontend-build-check:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: apps/web
      - name: Build frontend
        run: npm run build
        working-directory: apps/web
        env:
          VERCEL: "1"
